[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-evidence-kit"
version = "0.1.3"
description = "Reproducible sensing observations, independent labels and conservative characterization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{name = "HA Homelab contributors"}]
dependencies = []

[project.optional-dependencies]
record = ["aiohttp==3.14.4"]
test = ["aiohttp==3.14.4", "pytest==9.0.3", "ruff==0.16.5", "cryptography==50.0.1"]
dev = ["aiohttp==3.14.4", "build==1.2.2.post1", "ruff==0.16.5", "pytest==9.0.3", "cryptography==50.0.1"]

[project.scripts]
sensing-evidence = "sensing_evidence.session:main"
sensing-evidence-joint = "sensing_evidence.joint:main"
sensing-evidence-demo = "sensing_evidence.demo:main"

[project.urls]
Repository = "https://github.com/ha-homelab/sensing-evidence-kit"
Issues = "https://github.com/ha-homelab/sensing-evidence-kit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
